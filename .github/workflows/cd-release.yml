# CD demo: tag + Win/Linux binaries. NOT a second quality gate.
# Trusted path remains Docker + CTest (local gate / CI on Debian Bookworm).
# macOS is omitted on purpose (hosted runner queue stalled the pipeline).
#
# Test without merging to master:
#   Actions → CD Release Demo → Run workflow → branch feature/... → dry_run=true
# That builds Win/Linux artifacts only (no tag, no GitHub Release, no RELEASE.txt commit).
name: CD Release Demo

on:
  push:
    branches: [master]
  workflow_dispatch:
    inputs:
      dry_run:
        description: Build matrix only; do not create tag, Release, or RELEASE.txt commit
        type: boolean
        default: true

permissions:
  contents: write

jobs:
  tag:
    name: Next version tag
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.decide.outputs.version }}
      checkout_ref: ${{ steps.decide.outputs.checkout_ref }}
      should_build: ${{ steps.decide.outputs.should_build }}
      should_release: ${{ steps.decide.outputs.should_release }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Decide version / notes / tag / dry-run
        id: decide
        env:
          GH_TOKEN: ${{ github.token }}
          DRY_RUN: ${{ github.event_name == 'workflow_dispatch' && inputs.dry_run }}
        run: |
          set -euo pipefail

          dry_run=false
          if [[ "${DRY_RUN}" == "true" ]]; then
            dry_run=true
          fi

          latest="$(git tag -l 'v2.*' --sort=-v:refname | head -n1 || true)"
          if [[ -z "${latest}" ]]; then
            version="v2.4"
            prev=""
          else
            # v2.N -> v2.(N+1) per board (v2.4, v2.5, ...)
            minor="${latest#v2.}"
            if [[ ! "${minor}" =~ ^[0-9]+$ ]]; then
              echo "Unsupported latest tag '${latest}'; expected v2.N" >&2
              exit 1
            fi
            version="v2.$((minor + 1))"
            prev="${latest}"
          fi

          if [[ "${dry_run}" == "true" ]]; then
            echo "Dry run: will build ${version} artifacts from HEAD; no tag/release/RELEASE.txt."
            echo "version=${version}" >> "$GITHUB_OUTPUT"
            echo "checkout_ref=${GITHUB_SHA}" >> "$GITHUB_OUTPUT"
            echo "should_build=true" >> "$GITHUB_OUTPUT"
            echo "should_release=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          existing="$(git tag --points-at HEAD | grep -E '^v[0-9]' | head -n1 || true)"
          if [[ -n "${existing}" ]]; then
            echo "HEAD already tagged as ${existing}; skipping release."
            echo "version=${existing}" >> "$GITHUB_OUTPUT"
            echo "checkout_ref=${existing}" >> "$GITHUB_OUTPUT"
            echo "should_build=false" >> "$GITHUB_OUTPUT"
            echo "should_release=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          notes="$(mktemp)"
          {
            echo "## DealerDesk ${version} (CI/CD delivery demo)"
            echo ""
            echo "**This release is a demonstration of the delivery loop only.**"
            echo ""
            echo "- There is **no** sanity-test suite around these host binaries."
            echo "- Out-of-Docker use is at the **user's discretion**."
            echo "- Trusted quality path remains **Docker + CTest** (local pre-run gate and CI on Debian Bookworm)."
            echo "- Do **not** treat these artifacts as production-certified."
            echo ""
            echo "### Assets"
            echo "- \`dealerdesk-windows.exe\`"
            echo "- \`dealerdesk-linux\`"
            echo ""
            echo "### Changes since ${prev:-project start}"
            echo ""
            if [[ -n "${prev}" ]]; then
              git log --pretty=format:'- %s (%h)' "${prev}..HEAD"
            else
              git log --pretty=format:'- %s (%h)'
            fi
            echo ""
          } > "${notes}"

          chmod +x scripts/update-release-txt.sh
          ./scripts/update-release-txt.sh "${version}" "${notes}"

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add RELEASE.txt
          git commit -m "Update RELEASE.txt for ${version} [skip ci]"
          git push origin HEAD:master

          git tag -a "${version}" -m "DealerDesk ${version} (CD demo release)"
          git push origin "refs/tags/${version}"

          cp "${notes}" release-notes.md

          echo "version=${version}" >> "$GITHUB_OUTPUT"
          echo "checkout_ref=${version}" >> "$GITHUB_OUTPUT"
          echo "should_build=true" >> "$GITHUB_OUTPUT"
          echo "should_release=true" >> "$GITHUB_OUTPUT"

      - name: Upload release notes
        if: steps.decide.outputs.should_release == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: release-notes
          path: release-notes.md
          if-no-files-found: error

  build:
    name: Build ${{ matrix.artifact }}
    needs: tag
    if: needs.tag.outputs.should_build == 'true'
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            artifact: dealerdesk-windows.exe
            binary: dealerdesk.exe
          - os: ubuntu-latest
            artifact: dealerdesk-linux
            binary: dealerdesk
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ needs.tag.outputs.checkout_ref }}

      - name: Configure and build (no CTest; demo artifact only)
        shell: bash
        run: |
          set -euo pipefail
          cmake -S . -B build -DCMAKE_BUILD_TYPE=Release -DBUILD_TESTING=OFF
          cmake --build build --config Release

          if [[ -f "build/Release/${{ matrix.binary }}" ]]; then
            src="build/Release/${{ matrix.binary }}"
          elif [[ -f "build/${{ matrix.binary }}" ]]; then
            src="build/${{ matrix.binary }}"
          else
            echo "Binary not found for ${{ matrix.binary }}" >&2
            find build -name 'dealerdesk*' -print >&2 || true
            exit 1
          fi
          cp "${src}" "${{ matrix.artifact }}"
          ls -la "${{ matrix.artifact }}"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: ${{ matrix.artifact }}
          if-no-files-found: error

  release:
    name: GitHub Release
    needs: [tag, build]
    if: needs.tag.outputs.should_release == 'true'
    runs-on: ubuntu-latest
    steps:
      # gh release create discovers the repo via git unless --repo is set;
      # checkout avoids "not a git repository" even if --repo is ignored.
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ needs.tag.outputs.version }}

      - name: Download build artifacts
        uses: actions/download-artifact@v4
        with:
          path: dist
          pattern: dealerdesk-*
          merge-multiple: true

      - name: Download release notes
        uses: actions/download-artifact@v4
        with:
          name: release-notes
          path: notes

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.tag.outputs.version }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          ls -la dist notes
          gh release create "${VERSION}" \
            dist/dealerdesk-windows.exe \
            dist/dealerdesk-linux \
            --repo "${REPO}" \
            --title "DealerDesk ${VERSION}" \
            --notes-file notes/release-notes.md
